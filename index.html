    const menu = document.getElementById('menu-hamburguer');

        .then(reg => console.log('[SW] Registrado com sucesso!', reg))
        .catch(err => console.error('[SW] Erro ao registrar:', err));
    }
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('appInstalado')) {
        document.getElementById('install-banner').style.display = 'block';
      }
    });
    function instalarApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {

    border:none;
    border-radius:50%;
    background:#e53935;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
}
#fechar-anuncio:hover{
    background:#c62828;
}
@keyframes zoom{
    from{
        transform:scale(.85);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}
</style>
<div id="anuncio-overlay">
    <div id="anuncio-box">
        <button id="fechar-anuncio">&times;</button>
        <img
            id="anuncio-img"
            src="anuncio.png"
            alt="Anúncio">
    </div>
</div>
<script>
(function(){
    const LINK = "https://login.lottotrivo.net";
    const STORAGE_KEY = "anuncio_visto";
    const hoje = new Date().toISOString().slice(0,10);
    const overlay = document.getElementById("anuncio-overlay");
    const imagem = document.getElementById("anuncio-img");
    const fechar = document.getElementById("fechar-anuncio");
    if(localStorage.getItem(STORAGE_KEY) !== hoje){
        overlay.classList.add("show");
    }
    function ocultar(){
        overlay.classList.remove("show");
        localStorage.setItem(STORAGE_KEY, hoje);
    }
    fechar.addEventListener("click", function(e){
        e.stopPropagation();
        ocultar();
    });
    imagem.addEventListener("click", function(){
        ocultar();
        window.location.href = LINK;
    });
})();
</script>
  
</body>
</html>
