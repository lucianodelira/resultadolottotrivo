      border-radius: 50px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      height: 48px;
      padding: 0 28px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
      transition: all 0.25s ease;
      animation: pulseJogar 1.8s infinite;
    }

    #botao-jogar:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
    }

    @keyframes pulseJogar {
      0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.6); }
      70% { box-shadow: 0 0 0 16px rgba(255, 0, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }

    /* Menu Hambúrguer */
    #menu-hamburguer {
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #333;
      border-radius: 50px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
      user-select: none;
    }

    #menu-hamburguer:hover {
      background: #252525;
      border-color: #ff3333;
    }

    #menu-hamburguer svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s;
    }

    #menu-hamburguer.open svg {
      transform: rotate(90deg);
    }

    /* Container dos botões flutuantes */
    .botoes-container {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid #333;
      border-radius: 16px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .botoes-container.open {
      max-height: 90px;
      opacity: 1;
      pointer-events: auto;
    }

    .botao-flutuante {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid #333;
      background: #111;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .botao-flutuante img {

  <script>
    // Menu

    function toggleMenu() {

      botoesContainer.classList.toggle('open');

    menu.addEventListener('click', toggleMenu);
    menu.addEventListener('keydown', e => {

        toggleMenu();
      }
    });

    // Service Worker + Install
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('[SW] OK', reg))
        .catch(err => console.warn('[SW]', err));
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!localStorage.getItem('appInstalado')) {
        document.getElementById('install-banner').style.display = 'block';
      }
    });

    function instalarApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((result) => {
          if (result.outcome === 'accepted') {
            localStorage.setItem('appInstalado', 'true');
          }
          document.getElementById('install-banner').style.display = 'none';
          deferredPrompt = null;
        });
      }
    }
